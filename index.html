<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI in Fashion Technology — Course Deck</title>
<meta name="description" content="A 30-slide interactive course deck on AI in fashion technology: computer vision, generative design, virtual try-on, personalization, ethics and hands-on tasks.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="grain"></div>

  <div id="deck"></div>

  <div class="chrome">
    <div class="left">
      <span class="deckname">AI × FASHION TECH</span>
      <span id="counter">PAGE 01 / 30</span>
      <div class="progress"><span id="progress-bar" style="width:3.3%"></span></div>
    </div>
    <div class="navbtns">
      <button id="overviewBtn" title="Overview (O)">Overview</button>
      <button id="prevBtn" title="Previous (←)">← Prev</button>
      <button id="nextBtn" title="Next (→ / Space)">Next →</button>
    </div>
  </div>

  <div id="overview">
    <button class="ov-close" id="ov-close">CLOSE ✕</button>
    <div class="ov-grid" id="ov-grid"></div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
